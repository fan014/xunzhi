<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="原创网络拓扑图">
  <rect width="900" height="560" fill="#ffffff"/>
  <g fill="none" stroke="#5b6b62" stroke-width="3">
    <line x1="200" y1="110" x2="330" y2="250"/>
    <line x1="200" y1="400" x2="330" y2="280"/>
    <line x1="500" y1="285" x2="640" y2="350"/>
    <line x1="730" y1="330" x2="720" y2="150"/>
  </g>
  <g fill="#ffffff" stroke-width="3">
    <rect x="40" y="70" width="160" height="80" stroke="#1f6b4a"/>
    <rect x="40" y="360" width="160" height="80" stroke="#1f6b4a"/>
    <rect x="620" y="70" width="180" height="80" stroke="#1f6b4a"/>
    <rect x="330" y="230" width="170" height="70" stroke="#2f6fa8"/>
    <rect x="640" y="330" width="180" height="80" stroke="#a35b2b"/>
  </g>
  <g fill="#17211c" font-family="Microsoft YaHei, sans-serif" font-size="20">
    <text x="75" y="120">PC-A</text>
    <text x="75" y="410">PC-B</text>
    <text x="660" y="120">PC-C</text>
    <text x="380" y="272">SW1</text>
    <text x="695" y="375">R1</text>
  </g>
  <g fill="#5b6b62" font-family="Microsoft YaHei, sans-serif" font-size="17">
    <text x="60" y="220">192.168.1.0/24</text>
    <text x="760" y="215">192.168.2.0/24</text>
    <text x="60" y="510">原创示例：PC-A 与 PC-B 同接 SW1；SW1 连接 R1；PC-C 在 R1 另一侧。</text>
  </g>
</svg>